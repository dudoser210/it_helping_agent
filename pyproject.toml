[project]
name = "it-helping-agent"
version = "1.0.0"
description = "Local multi-agent IT Helping powered by Ollama"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.29,<2", "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
