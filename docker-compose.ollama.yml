services:
  agent:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama: {condition: service_healthy}
  ollama:
    image: ollama/ollama:0.12.0
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: ["11434:11434"]
    restart: unless-stopped
volumes:
  ollama_data:
    external: true
    name: it-helping_ollama_data